worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size 50M;

    # ── SSL session cache ────────────────────────────────────
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── Logging a stdout (formato Docker) ────────────────────
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status"'
    '}';

    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    # ── Mapa para Cabecera Connection (WebSocket) ────────────
    map $http_upgrade $connection_upgrade {
        default  "upgrade";
        ""       "close";
    }

    # ── Redirigir HTTP → HTTPS ───────────────────────────────
    server {
        listen 80;
        server_name aplicaciones.uteq.edu.ec;
        return 301 https://$server_name$request_uri;
    }

    # ── Servidor HTTPS ───────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        server_name aplicaciones.uteq.edu.ec;

        ssl_certificate     /ssl/__uteq_edu_ec2026Enero_cert_out.pem;
        ssl_certificate_key /ssl/__uteq_edu_ec.key;

        # ── Archivos estáticos ───────────────────────────────
        location /static/ {
            alias /var/www/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ── Proxy API ────────────────────────────────────────
        location / {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $upstream_api http://api:8000;
            proxy_pass $upstream_api;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
        }
    }
}
