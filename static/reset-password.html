<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña — RutAI</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --brand: #1D9E75;
            --brand-dark: #0F6E56;
            --brand-light: #E1F5EE;
            --brand-muted: #9FE1CB;
            --text: #1a1a1a;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --bg: #f9fafb;
            --white: #ffffff;
            --danger: #E24B4A;
            --danger-bg: #FCEBEB;
            --success: #3B6D11;
            --success-bg: #EAF3DE;
            --radius: 12px;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: var(--text);
        }

        .card {
            background: var(--white);
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 2rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--brand);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #fff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 0.4rem;
            letter-spacing: -0.3px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .field {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrap {
            position: relative;
        }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            height: 48px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 0 44px 0 14px;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            color: var(--text);
            background: var(--white);
            outline: none;
            transition: border-color 0.15s;
        }

        input:focus {
            border-color: var(--brand);
        }

        .toggle-eye {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-muted);
            background: none;
            border: none;
            padding: 0;
            display: flex;
            align-items: center;
        }

        .toggle-eye svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .strength-bar {
            display: flex;
            gap: 4px;
            margin-top: 8px;
            height: 3px;
        }

        .strength-bar span {
            flex: 1;
            border-radius: 2px;
            background: var(--border);
            transition: background 0.2s;
        }

        .strength-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .btn {
            width: 100%;
            height: 50px;
            background: var(--brand);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background 0.15s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: var(--brand-dark);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            background: var(--brand-muted);
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            border-radius: var(--radius);
            padding: 12px 14px;
            font-size: 14px;
            margin-bottom: 1.2rem;
            display: none;
            line-height: 1.5;
        }

        .alert.error {
            background: var(--danger-bg);
            color: var(--danger);
            border: 1px solid #F7C1C1;
        }

        .alert.success {
            background: var(--success-bg);
            color: var(--success);
            border: 1px solid #C0DD97;
        }

        .alert.show {
            display: block;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .done-state {
            text-align: center;
            padding: 1rem 0;
            display: none;
        }

        .done-icon {
            width: 60px;
            height: 60px;
            background: var(--success-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.2rem;
        }

        .done-icon svg {
            width: 28px;
            height: 28px;
            stroke: var(--brand);
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .done-state h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .done-state p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2L4 7v10l8 5 8-5V7z" />
                    <path d="M12 22V12M4 7l8 5 8-5" />
                </svg>
            </div>
            <span class="logo-text">RutAI</span>
        </div>

        <div id="form-view">
            <h1>Nueva contraseña</h1>
            <p class="subtitle">Crea una contraseña segura para volver a acceder a tu cuenta.</p>

            <div id="alert" class="alert"></div>

            <div class="field">
                <label for="pass1">Nueva contraseña</label>
                <div class="input-wrap">
                    <input type="password" id="pass1" placeholder="Mínimo 8 caracteres" oninput="evalStrength()" />
                    <button class="toggle-eye" onclick="toggleVis('pass1', this)" type="button"
                        aria-label="Mostrar contraseña">
                        <svg id="eye1" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
                <div class="strength-bar">
                    <span id="s1"></span><span id="s2"></span><span id="s3"></span><span id="s4"></span>
                </div>
                <div class="strength-label" id="strength-label"></div>
            </div>

            <div class="field">
                <label for="pass2">Confirmar contraseña</label>
                <div class="input-wrap">
                    <input type="password" id="pass2" placeholder="Repite la contraseña" />
                    <button class="toggle-eye" onclick="toggleVis('pass2', this)" type="button"
                        aria-label="Mostrar contraseña">
                        <svg viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
            </div>

            <button class="btn" id="submit-btn" onclick="submitReset()">
                Restablecer contraseña
            </button>
        </div>

        <div class="done-state" id="done-view">
            <div class="done-icon">
                <svg viewBox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12" />
                </svg>
            </div>
            <h2>¡Listo!</h2>
            <p>Tu contraseña fue actualizada correctamente.<br>Vuelve a la app e inicia sesión.</p>
        </div>
    </div>

    <script>
        const API_BASE = "https://aplicaciones.uteq.edu.ec:9615";

        function getToken() {
            const p = new URLSearchParams(window.location.search);
            return p.get("token") || "";
        }

        function showAlert(msg, type) {
            const el = document.getElementById("alert");
            el.textContent = msg;
            el.className = "alert " + type + " show";
        }

        function hideAlert() {
            const el = document.getElementById("alert");
            el.className = "alert";
        }

        function toggleVis(inputId, btn) {
            const input = document.getElementById(inputId);
            const isPass = input.type === "password";
            input.type = isPass ? "text" : "password";
            btn.querySelector("svg").innerHTML = isPass
                ? '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
                : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        }

        function evalStrength() {
            const val = document.getElementById("pass1").value;
            const bars = [document.getElementById("s1"), document.getElementById("s2"),
            document.getElementById("s3"), document.getElementById("s4")];
            const label = document.getElementById("strength-label");
            bars.forEach(b => b.style.background = "#e5e7eb");

            let score = 0;
            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            const colors = ["#E24B4A", "#EF9F27", "#1D9E75", "#0F6E56"];
            const labels = ["", "Débil", "Regular", "Buena", "Fuerte"];
            for (let i = 0; i < score; i++) bars[i].style.background = colors[score - 1];
            label.textContent = val.length > 0 ? labels[score] : "";
        }

        async function submitReset() {
            hideAlert();
            const token = getToken();
            const pass1 = document.getElementById("pass1").value.trim();
            const pass2 = document.getElementById("pass2").value.trim();

            if (!token) { showAlert("El enlace no es válido. Solicita uno nuevo.", "error"); return; }
            if (pass1.length < 8) { showAlert("La contraseña debe tener al menos 8 caracteres.", "error"); return; }
            if (pass1 !== pass2) { showAlert("Las contraseñas no coinciden.", "error"); return; }

            const btn = document.getElementById("submit-btn");
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div>';

            try {
                const res = await fetch(`${API_BASE}/login/reset-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token, nueva_contrasenia: pass1 })
                });

                const data = await res.json();

                if (res.ok) {
                    document.getElementById("form-view").style.display = "none";
                    document.getElementById("done-view").style.display = "block";
                } else {
                    const msg = data.detail || "Ocurrió un error. Intenta de nuevo.";
                    showAlert(msg, "error");
                    btn.disabled = false;
                    btn.innerHTML = "Restablecer contraseña";
                }
            } catch (e) {
                showAlert("No se pudo conectar al servidor. Verifica tu conexión.", "error");
                btn.disabled = false;
                btn.innerHTML = "Restablecer contraseña";
            }
        }

        if (!getToken()) {
            document.addEventListener("DOMContentLoaded", () => {
                showAlert("Enlace inválido o expirado. Solicita un nuevo correo de recuperación.", "error");
                document.getElementById("submit-btn").disabled = true;
            });
        }
    </script>

</body>

</html>
