# docker-compose.yml — RutAI Backend + Nginx

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: rutai-backend:local
    container_name: rutai_api
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    networks:
      - rutai_net

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: rutai-nginx:local
    container_name: rutai_nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Certificados SSL (montar ruta real del servidor)
      - /ssl:/ssl:ro
      # Archivos estáticos
      - ./static:/var/www/static:ro

    depends_on:
      api:
        condition: service_healthy

    networks:
      - rutai_net

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  rutai_net:
    driver: bridge
